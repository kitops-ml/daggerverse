name: Run dagger examples
on:
  pull_request: 
    
jobs:
  examples:
    name: Run examples 
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      
      - name: Run
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77
        with:
          version: "latest"
          verb: call
          module: ./tests
          args: all
