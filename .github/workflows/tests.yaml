name: Run dagger examples
on:
  pull_request: 
    
jobs:
  examples:
    name: Run examples 
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      
      - name: Run
        uses: dagger/dagger-for-github@456fc3af63a2ba6f9789af9c55045b459115541b
        with:
          version: "latest"
          verb: call
          module: ./tests
          args: all
